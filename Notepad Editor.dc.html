<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/nocturne-ccaceeef-4b43-445a-9eb8-dff299e4d7a0/styles.css">
<script src="_ds/nocturne-ccaceeef-4b43-445a-9eb8-dff299e4d7a0/_ds_bundle.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; }
  :root {
    --np-bg: #161826; --np-surface: #1c1e2c; --np-text: #e9e9ed; --np-muted: #9397ab;
    --np-faint: #75798c; --np-line: #2b2e3c; --np-accent: #9184d9; --np-accent-soft: #423a6a;
    --np-glow: rgba(145,132,217,0.16);
  }
  [data-np="light"] {
    --np-bg: #f3f5fe; --np-surface: #e9ecfa; --np-text: #292b31; --np-muted: #75798c;
    --np-faint: #9397ab; --np-line: #d8dcee; --np-accent: #5d5294; --np-accent-soft: #d2cefd;
    --np-glow: rgba(93,82,148,0.10);
  }
  ::selection { background: var(--np-accent-soft); }
  a { color: var(--np-accent); text-decoration: none; }
  a:hover { color: var(--np-text); }
  textarea::placeholder { color: var(--np-faint); }
  @keyframes np-pulse { 0%,100% { opacity: .35; transform: scale(.85);} 50% { opacity: 1; transform: scale(1);} }
</style>
</helmet>
<div data-np="{{ theme }}" style="height: 100vh; display: flex; flex-direction: column; background: var(--np-bg); color: var(--np-text); font-family: Inter, system-ui, sans-serif; transition: background .25s ease, color .25s ease;">

  <header style="flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 20px; height: 46px; border-bottom: 1px solid var(--np-line);">
    <div style="display: flex; align-items: center; gap: 8px; min-width: 0;">
      <span style="display: flex; width: 15px; height: 15px; color: var(--np-faint);">
        <svg viewBox="0 0 256 256" fill="currentColor" width="15" height="15"><path d="M208 80h-28V56a52 52 0 0 0-104 0v24H48a16 16 0 0 0-16 16v112a16 16 0 0 0 16 16h160a16 16 0 0 0 16-16V96a16 16 0 0 0-16-16ZM92 56a36 36 0 0 1 72 0v24H92Zm44 128.6V200a8 8 0 0 1-16 0v-15.4a20 20 0 1 1 16 0Z"/></svg>
      </span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--np-faint); letter-spacing: -0.01em;">notey.space/</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; color: var(--np-text); letter-spacing: -0.01em;">{{ slug }}</span>
      <button type="button" onClick="{{ copyLink }}" style="display: inline-flex; align-items: center; gap: 5px; margin-left: 4px; padding: 3px 8px; font: inherit; font-size: 11px; color: var(--np-muted); background: transparent; border: 1px solid var(--np-line); border-radius: 999px; cursor: pointer; transition: color .15s, border-color .15s;" style-hover="color: var(--np-accent); border-color: var(--np-accent);">{{ copyLabel }}</button>
    </div>

    <div style="display: flex; align-items: center; gap: 4px;">
      <div style="display: flex; align-items: center; gap: 7px; padding-right: 10px; margin-right: 6px; border-right: 1px solid var(--np-line); font-size: 12px; color: var(--np-muted);">
        <span style="width: 6px; height: 6px; border-radius: 999px; background: var(--np-accent); animation: np-pulse 2.4s ease-in-out infinite;"></span>
        <span>{{ saveLabel }}</span>
      </div>
      <button type="button" onClick="{{ togglePreview }}" title="Markdown preview" style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; font: inherit; font-size: 12px; color: var(--np-muted); background: transparent; border: 1px solid transparent; border-radius: 8px; cursor: pointer;" style-hover="background: var(--np-surface); color: var(--np-text);">
        <svg viewBox="0 0 256 256" fill="currentColor" width="15" height="15"><path d="M224 56H32a16 16 0 0 0-16 16v112a16 16 0 0 0 16 16h192a16 16 0 0 0 16-16V72a16 16 0 0 0-16-16ZM72 168v-48l24 24 24-24v48h-16v-20l-8 8-8-8v20Zm112-16 24-32h-16V96h-16v24h-16Z"/></svg>
        <span>{{ previewLabel }}</span>
      </button>
      <button type="button" onClick="{{ toggleLockPanel }}" title="Password protect" style="display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; color: var(--np-muted); background: transparent; border: 1px solid transparent; border-radius: 8px; cursor: pointer;" style-hover="background: var(--np-surface); color: var(--np-text);">
        <svg viewBox="0 0 256 256" fill="currentColor" width="16" height="16"><path d="M208 80h-28V56a52 52 0 0 0-104 0v24H48a16 16 0 0 0-16 16v112a16 16 0 0 0 16 16h160a16 16 0 0 0 16-16V96a16 16 0 0 0-16-16ZM92 56a36 36 0 0 1 72 0v24H92Zm44 128.6V200a8 8 0 0 1-16 0v-15.4a20 20 0 1 1 16 0Z"/></svg>
      </button>
      <button type="button" onClick="{{ toggleTheme }}" title="Light / dark" style="display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; color: var(--np-muted); background: transparent; border: 1px solid transparent; border-radius: 8px; cursor: pointer;" style-hover="background: var(--np-surface); color: var(--np-text);">
        {{ themeIcon }}
      </button>
    </div>
  </header>

  <sc-if value="{{ lockOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; top: 52px; right: 20px; z-index: 20; width: 268px; padding: 14px; background: var(--np-surface); border: 1px solid var(--np-line); border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,0.35);">
      <div style="font-size: 13px; font-weight: 500; margin-bottom: 3px;">Lock this note</div>
      <div style="font-size: 12px; color: var(--np-muted); margin-bottom: 10px; text-wrap: pretty;">Anyone with the link will need the password. We can't recover it for you.</div>
      <input type="password" value="hunter2••" readOnly style="width: 100%; box-sizing: border-box; height: 32px; padding: 0 10px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--np-text); background: var(--np-bg); border: 1px solid var(--np-accent); border-radius: 8px; outline: none;">
      <div style="display: flex; gap: 8px; margin-top: 10px;">
        <button type="button" onClick="{{ toggleLockPanel }}" style="flex: 1; height: 30px; font: inherit; font-size: 12px; color: var(--np-accent); background: transparent; border: 1px solid var(--np-accent); border-radius: 8px; cursor: pointer;" style-hover="background: var(--np-glow);">Set password</button>
        <button type="button" onClick="{{ toggleLockPanel }}" style="height: 30px; padding: 0 12px; font: inherit; font-size: 12px; color: var(--np-muted); background: transparent; border: 1px solid var(--np-line); border-radius: 8px; cursor: pointer;" style-hover="color: var(--np-text);">Cancel</button>
      </div>
    </div>
  </sc-if>

  <main style="flex: 1 1 auto; display: flex; min-height: 0; justify-content: center;">
    <div style="flex: 1 1 0; display: flex; justify-content: center; min-width: 0; overflow: auto;">
      <textarea value="{{ text }}" onChange="{{ onType }}" spellCheck="{{ false }}" placeholder="Start typing. It saves itself." style="width: 100%; max-width: 760px; box-sizing: border-box; padding: 44px 32px 80px; border: none; outline: none; resize: none; background: transparent; color: var(--np-text); caret-color: var(--np-accent); font-family: 'JetBrains Mono', monospace; font-size: 15px; line-height: 1.85; letter-spacing: -0.01em; tab-size: 2;"></textarea>
    </div>
    <sc-if value="{{ preview }}" hint-placeholder-val="{{ false }}">
      <div style="flex: 1 1 0; min-width: 0; overflow: auto; border-left: 1px solid var(--np-line); background: var(--np-surface);">
        <div style="max-width: 700px; padding: 44px 40px 80px; font-size: 15px; line-height: 1.7;">{{ rendered }}</div>
      </div>
    </sc-if>
  </main>

  <footer style="flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 20px; height: 34px; border-top: 1px solid var(--np-line); font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--np-faint); letter-spacing: 0.01em;">
      <div style="display: flex; align-items: center; gap: 14px;">
        <span>{{ wordCount }} words</span>
        <span>{{ charCount }} characters</span>
        <span>{{ lineCount }} lines</span>
      </div>
      <div style="display: flex; align-items: center; gap: 14px;">
        <span>Plain text · UTF-8</span>
        <span style="color: var(--np-muted);">No account needed — the URL is the note.</span>
      </div>
  </footer>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;'dark'|'light'&quot;},&quot;showPreview&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;slug&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;kitchen-rebuild&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;initialText&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;}}">
const SAMPLE = `# Kitchen rebuild — notes

Dropped the second quote in here so it stops living in my inbox.

## What we agreed
- Keep the window where it is. Moving it eats two weeks.
- Butcher block on the island, quartz everywhere else.
- Plumber comes **before** the tiler, not after.

## Numbers
Cabinets      4,200
Counters      2,850
Labour        6,100
--------------------
Total        13,150

## Open questions
- [ ] Does the extractor need an external vent?
- [x] Confirm the delivery window (Tue 9–12)
- [ ] Ask about the hinge upgrade — worth it?

> "Order the tile first. Everything waits on tile."

Anyone with this link can read it. Lock it if that matters.`;

class Component extends DCLogic {
  state = {
    theme: null, text: null, preview: null, lockOpen: false,
    copied: false, saved: "Saved just now",
  };

  get theme() { return this.state.theme ?? this.props.theme ?? "dark"; }
  get text() { return this.state.text ?? this.props.initialText ?? SAMPLE; }
  get preview() { return this.state.preview ?? this.props.showPreview ?? false; }

  md(src) {
    const inline = (s) => {
      const out = [];
      const re = /(\*\*[^*]+\*\*|`[^`]+`)/g;
      let last = 0, m;
      while ((m = re.exec(s))) {
        if (m.index > last) out.push(s.slice(last, m.index));
        const t = m[0];
        if (t.startsWith("**")) out.push(React.createElement("strong", { key: out.length, style: { fontWeight: 600 } }, t.slice(2, -2)));
        else out.push(React.createElement("code", { key: out.length, style: { fontFamily: "'JetBrains Mono', monospace", fontSize: "0.88em", padding: "1px 5px", borderRadius: 5, background: "var(--np-glow)", color: "var(--np-accent)" } }, t.slice(1, -1)));
        last = m.index + t.length;
      }
      if (last < s.length) out.push(s.slice(last));
      return out;
    };
    const nodes = [];
    (src || "").split("\n").forEach((raw, i) => {
      const line = raw.trimEnd();
      const key = "l" + i;
      if (!line.trim()) { nodes.push(React.createElement("div", { key, style: { height: 12 } })); return; }
      if (/^#\s/.test(line)) { nodes.push(React.createElement("h1", { key, style: { fontSize: 26, fontWeight: 500, letterSpacing: "-0.02em", margin: "0 0 14px" } }, inline(line.slice(2)))); return; }
      if (/^##\s/.test(line)) { nodes.push(React.createElement("h2", { key, style: { fontSize: 15, fontWeight: 500, textTransform: "uppercase", letterSpacing: "0.09em", color: "var(--np-accent)", margin: "22px 0 8px" } }, inline(line.slice(3)))); return; }
      if (/^>\s/.test(line)) { nodes.push(React.createElement("blockquote", { key, style: { margin: "14px 0", padding: "2px 0 2px 14px", borderLeft: "2px solid var(--np-accent)", color: "var(--np-muted)", fontStyle: "italic" } }, inline(line.slice(2)))); return; }
      const task = line.match(/^-\s\[( |x)\]\s(.*)$/);
      if (task) {
        const done = task[1] === "x";
        nodes.push(React.createElement("div", { key, style: { display: "flex", gap: 9, alignItems: "baseline", padding: "3px 0", color: done ? "var(--np-faint)" : "inherit", textDecoration: done ? "line-through" : "none" } },
          React.createElement("span", { style: { fontFamily: "'JetBrains Mono', monospace", fontSize: 12, color: done ? "var(--np-accent)" : "var(--np-faint)" } }, done ? "✓" : "○"),
          React.createElement("span", null, inline(task[2]))));
        return;
      }
      if (/^-\s/.test(line)) {
        nodes.push(React.createElement("div", { key, style: { display: "flex", gap: 9, alignItems: "baseline", padding: "3px 0" } },
          React.createElement("span", { style: { color: "var(--np-accent)" } }, "—"),
          React.createElement("span", null, inline(line.slice(2)))));
        return;
      }
      if (/^-{4,}$/.test(line) || /^\s*\S+\s{2,}[\d,\.]+$/.test(line)) {
        nodes.push(React.createElement("div", { key, style: { fontFamily: "'JetBrains Mono', monospace", fontSize: 13, whiteSpace: "pre", color: "var(--np-muted)" } }, line));
        return;
      }
      nodes.push(React.createElement("p", { key, style: { margin: "0 0 8px", textWrap: "pretty" } }, inline(line)));
    });
    return nodes;
  }

  renderVals() {
    const text = this.text;
    const words = text.trim() ? text.trim().split(/\s+/).length : 0;
    const themeIcon = this.theme === "dark"
      ? React.createElement("svg", { viewBox: "0 0 256 256", fill: "currentColor", width: 16, height: 16 }, React.createElement("path", { d: "M233 150.1a8 8 0 0 0-8.2-2.9 88.6 88.6 0 0 1-20.8 2.5A88.1 88.1 0 0 1 116 61.6a89.6 89.6 0 0 1 2.5-20.8 8 8 0 0 0-9.9-9.7A104 104 0 1 0 236 161.8a8 8 0 0 0-3-11.7Z" }))
      : React.createElement("svg", { viewBox: "0 0 256 256", fill: "currentColor", width: 16, height: 16 }, React.createElement("path", { d: "M120 40V16a8 8 0 0 1 16 0v24a8 8 0 0 1-16 0Zm8 24a64 64 0 1 0 64 64 64.1 64.1 0 0 0-64-64Zm-69.7 5.7a8 8 0 0 0 11.4-11.4l-16-16a8 8 0 0 0-11.4 11.4Zm0 116.6-16 16a8 8 0 0 0 11.4 11.4l16-16a8 8 0 0 0-11.4-11.4ZM192 72a8 8 0 0 0 5.7-2.3l16-16a8 8 0 0 0-11.4-11.4l-16 16A8 8 0 0 0 192 72Zm5.7 114.3a8 8 0 0 0-11.4 11.4l16 16a8 8 0 0 0 11.4-11.4ZM48 128a8 8 0 0 0-8-8H16a8 8 0 0 0 0 16h24a8 8 0 0 0 8-8Zm80 80a8 8 0 0 0-8 8v24a8 8 0 0 0 16 0v-24a8 8 0 0 0-8-8Zm112-88h-24a8 8 0 0 0 0 16h24a8 8 0 0 0 0-16Z" }));

    return {
      theme: this.theme,
      text,
      preview: this.preview,
      lockOpen: this.state.lockOpen,
      slug: this.props.slug ?? "kitchen-rebuild",
      saveLabel: this.state.saved,
      previewLabel: this.preview ? "Editing + preview" : "Preview",
      copyLabel: this.state.copied ? "Link copied" : "Copy link",
      themeIcon,
      rendered: this.md(text),
      wordCount: words.toLocaleString(),
      charCount: text.length.toLocaleString(),
      lineCount: text.split("\n").length,
      onType: (e) => this.setState({ text: e.target.value, saved: "Saving…" }, () => {
        clearTimeout(this._t);
        this._t = setTimeout(() => this.setState({ saved: "Saved just now" }), 700);
      }),
      toggleTheme: () => this.setState({ theme: this.theme === "dark" ? "light" : "dark" }),
      togglePreview: () => this.setState({ preview: !this.preview }),
      toggleLockPanel: () => this.setState({ lockOpen: !this.state.lockOpen }),
      copyLink: () => { this.setState({ copied: true }); setTimeout(() => this.setState({ copied: false }), 1600); },
    };
  }
}

</script>
</body>
</html>
