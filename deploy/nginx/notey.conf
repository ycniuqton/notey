# notey reverse proxy for nginx.
# Install this, then let certbot add the HTTPS (443) block + auto-renewing certificate:
#   sudo cp deploy/nginx/notey.conf /etc/nginx/sites-available/notey.conf
#   sudo ln -s /etc/nginx/sites-available/notey.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d notey.space -d www.notey.space
# certbot rewrites this file to serve TLS on 443 and redirect 80 -> 443.

server {
    listen 80;
    listen [::]:80;
    server_name notey.space www.notey.space;

    # Keep the max upload in step with notey's own body cap (~1.2 MB).
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
