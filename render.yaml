# Render Blueprint. In the Render dashboard: New → Blueprint → point at this repo.
services:
  - type: web
    name: notey
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /
    envVars:
      - key: NOTEY_HOST
        value: "0.0.0.0"
      - key: NOTEY_PORT
        value: "8080"
      - key: NOTEY_STORE
        value: /data
    # Persistent notes. A disk pins the service to a single instance — correct here.
    disk:
      name: notey-data
      mountPath: /data
      sizeGB: 1
