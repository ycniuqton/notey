# notey — production compose.
# Fronted by the existing Caddy reverse proxy (on the `chatwoot_default` network);
# notes persisted in the external `notey-data` volume. Redeploy with:
#   docker compose up -d --build        (and `docker compose down` to stop)
# Both keep the volume AND the network, so notes survive and Caddy keeps reaching
# notey by name — no more "wrong volume / 502" surprises.
#
# This expects two pre-existing resources on the host:
#   - network  chatwoot_default   (the Caddy reverse-proxy network)
#   - volume   notey-data         (your notes)
# For a standalone/local run without those, drop the two `external: true` blocks
# and use plain `volumes: [notey-data:/data]` + a published port.
services:
  notey:
    build: .
    image: notey:latest
    container_name: notey
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NOTEY_HOST: "0.0.0.0"
      NOTEY_PORT: "8080"
      NOTEY_STORE: "/data"
    volumes:
      - data:/data
    networks:
      - caddy

networks:
  caddy:
    external: true
    name: chatwoot_default

volumes:
  data:
    external: true
    name: notey-data
